services:
  - type: web
    name: bondbook-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bondbook-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: bondbook-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bondbook-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: bondbook-db
    plan: free
